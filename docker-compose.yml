services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelscan-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SentinelScan
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:////app/data/sentinelscan.db
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173", "http://127.0.0.1", "http://127.0.0.1:5173"]
      - MAX_CONCURRENT_SCANS=5
      - SCAN_TIMEOUT_SECONDS=30
      - MAX_REDIRECTS=5
      - MAX_RESPONSE_BYTES=2097152
      - LOG_LEVEL=INFO
    volumes:
      - sentinelscan_data:/app/data
    networks:
      - sentinelscan_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelscan-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentinelscan_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sentinelscan_data:
    driver: local

networks:
  sentinelscan_net:
    driver: bridge
