name: SentinelScan CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-quality-and-tests:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Code Quality & Static Analysis (Ruff)
        working-directory: ./backend
        run: |
          ruff check app tests

      - name: Execute Security & Unit Test Suite (Pytest)
        working-directory: ./backend
        run: |
          pytest -v

  frontend-build-and-typecheck:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck and Compile Production Assets
        working-directory: ./frontend
        run: |
          npm run build
